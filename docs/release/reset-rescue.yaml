title: Reset Rescue
description: >-
  Rescues expiring OpenAI Codex rate-limit reset credits across the openai-codex accounts in the active Hermes profile's credential pool, falling back to the active sign-in when the pool has no usable accounts. By default, Hermes cron schedules a primary attempt 10 minutes before expiry and a backup 4 minutes before, then reads the credit list back. Reminders and results use your existing Hermes channel. Optional quota-based early redemption is off by default; confirmed Redeem now spends a credit manually. By design it does not purchase credits or enable overage. The Desktop popup lists every account, with history, settings that save on change, English and pt-BR, and per-account overrides with two or more accounts. Account labels and domains are masked by default; tokens and raw credit IDs are not logged.
  Credential and network disclosure: Hermes read_credential_pool supplies each openai-codex account's access token. The plugin holds it in memory for that account's requests only, and does not store or log it. The plugin does not parse or write auth.json, other profiles or another tool's credentials. If the profile has no pool, Hermes' helper reads the global-root pool read-only. Requests send Codex CLI client headers (User-Agent codex-cli, ChatGPT-Account-ID) to chatgpt.com for the credit list, usage and credit consume calls. The consume POST uses a private, undocumented endpoint that may change. On HTTP 401 the plugin runs hermes auth refresh; Hermes performs the refresh and may rotate and save credentials in the pool. The active sign-in fallback uses credentialed_provider_request. The plugin creates and removes its own Hermes cron jobs and launcher scripts and runs hermes send. Local state holds salted keys, masked labels, results and request IDs, and no credentials. Pool-token use is a disclosed deviation from catalog rule 11, not full compliance; see the PR body for the exception request.
